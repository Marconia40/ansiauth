# Comandos CLI de Cisco IOS por operación. Editar acá para agregar una
# variación descubierta contra un device/modelo real -- no hace falta tocar
# driver.py ni reconstruir el playbook. Cada operación tiene un "primary" y,
# opcionalmente, "alternatives": cada alternativa lleva "triggered_by_error"
# (regex contra stderr+stdout del intento primario) -- si matchea, se
# reintenta una vez con esa alternativa antes de devolver el error real.
#
# Formas válidas para "primary"/cada alternativa (se infiere de qué clave
# está presente):
#   lines: [...] + parents: "..."  (opcional)  -> cisco.ios.ios_config
#   commands: [...]                            -> cisco.ios.ios_command
#
# Placeholders disponibles por operación: ver el método correspondiente en
# driver.py (arma el dict "vars" antes de llamar a _aplicar_desde_template()).

create_vlan:
  primary:
    parents: "vlan {vlan_id}"
    lines: ["name {name}"]

delete_vlan:
  primary:
    lines: ["no vlan {vlan_id}"]

update_vlan:
  primary:
    parents: "vlan {vlan_id}"
    lines: ["name {name}"]

save_config:
  primary:
    commands: ["write"]

list_vlans:
  primary:
    commands: ["show vlan brief"]

list_ports:
  primary:
    commands:
      - "show interfaces status"
      - "show interfaces description"
      - "show interfaces switchport"
      # 4to comando: bulk-read del storm-control. Un tabla por puerto
      # (Interface / Filter State / Trap State / Upper / Lower / Current);
      # "Forwarding" o "Blocking" = enabled, "inactive" = disabled,
      # Upper = porcentaje configurado. Un solo comando cubre todos los
      # puertos, mismo criterio que los 3 anteriores.
      # Nota: hay imágenes IOSv/GNS3 que NO implementan storm-control y
      # rechazan este comando con "% Invalid input detected". list_ports
      # y read_core_state llaman a _leer(partial_ok=True) + _filter_unsupported,
      # así que ese caso se degrada a storm_control=None por puerto en vez
      # de tirar el read entero.
      - "show storm-control broadcast"
      # 5to comando: "show storm-control broadcast" es estado OPERACIONAL
      # (forwarding/blocking), no expone qué "action" está configurada
      # (shutdown/trap) -- eso solo aparece como líneas de config real,
      # mismo criterio que ya usa svi_parser.py para SVIs. Tolerante igual
      # que el comando anterior via partial_ok+_filter_unsupported.
      - "show running-config | section ^interface"

update_port_description:
  set:
    primary:
      parents: "interface {interface}"
      lines: ["description {description}"]
  clear:
    primary:
      parents: "interface {interface}"
      lines: ["no description"]

set_port_admin_state:
  enabled:
    primary:
      parents: "interface {interface}"
      lines: ["no shutdown"]
  disabled:
    primary:
      parents: "interface {interface}"
      lines: ["shutdown"]

set_port_access_vlan:
  primary:
    parents: "interface {interface}"
    lines: ["switchport access vlan {vlan_id}"]

set_trunk_pvid_vlan:
  primary:
    parents: "interface {interface}"
    lines: ["switchport trunk native vlan {vlan_id}"]

set_trunk_allowed_vlans:
  primary:
    parents: "interface {interface}"
    lines: ["switchport trunk allowed vlan {allowed_vlans}"]

set_port_poe:
  enabled:
    primary:
      parents: "interface {interface}"
      lines: ["power inline auto"]
  disabled:
    primary:
      parents: "interface {interface}"
      lines: ["power inline never"]

# Sintaxis confirmada contra un Cisco real (no el IOSv de lab, que no
# implementa storm-control en absoluto -- "% Invalid input detected").
# "include multicast" hace que el umbral de broadcast también cuente
# tráfico multicast -- Cisco no tiene un "storm-control multicast level"
# separado como podría esperarse. "action" admite 2 líneas simultáneas
# (shutdown + trap), no son mutuamente excluyentes acá -- `action_lines`
# (Puerto.storm_control_action/storm_control_trap, cisco/driver.py's
# resolver_set_storm_control()) ya viene resuelta a 0-2 líneas: ninguna
# cuando action="filter" y trap=False (default implícito del device, sin
# esas 2 líneas no hay shutdown ni trap).
set_storm_control:
  enabled:
    primary:
      parents: "interface {interface}"
      lines:
      - "storm-control broadcast include multicast"
      - "storm-control broadcast level {threshold}"
      repeat:
        over: "action_lines"
        line: "{item}"

  disabled:
    # Mismo criterio "no X" de siempre en IOS, invierte las 4 líneas del
    # enable una por una (no solo el level) -- alta confianza, es el
    # patrón estándar de Cisco, ya usado en todo este archivo
    # (no shutdown/shutdown, no description, etc.).
    primary:
      parents: "interface {interface}"
      lines:
      - "no storm-control broadcast level"
      - "no storm-control broadcast include multicast"
      - "no storm-control action shutdown"
      - "no storm-control action trap"

reset_port:
  primary:
    lines: ["default interface {interface}"]

set_access_mode:
  primary:
    parents: "interface {interface}"
    lines:
      - "switchport mode access"
      - "switchport access vlan {vlan_id}"

set_trunk_mode:
  primary:
    parents: "interface {interface}"
    lines:
      - "switchport mode trunk"
      - "switchport trunk native vlan {native_vlan}"
      - "switchport trunk allowed vlan {allowed_vlans}"
  # Switches con soporte dual ISL/dot1q traen la encapsulación en "Auto" y
  # algunos IOS exigen fijarla antes de poder pasar a trunk -- confirmado
  # contra un device real de lab. "no negotiation auto" NO es el fix (esa
  # es otra feature de IOS, negociación de velocidad/DTP, no toca la
  # encapsulación) -- el comando real es "switchport trunk encapsulation
  # dot1q", que fija la encapsulación antes de reintentar "mode trunk".
  alternatives:
    - triggered_by_error: 'trunk encapsulation is .Auto.'
      parents: "interface {interface}"
      lines:
        - "switchport trunk encapsulation dot1q"
        - "switchport mode trunk"
        - "switchport trunk native vlan {native_vlan}"
        - "switchport trunk allowed vlan {allowed_vlans}"

# ── SVI, RF-INTERV-* ─────────────────────────────────
# "interface Vlan{vlan_id}" -- crear = entrar a la interfaz (IOS la crea
# sola si la VLAN existe; eso se valida antes en el endpoint, no acá).

create_svi:
  primary:
    lines: ["interface Vlan{vlan_id}", "no shutdown"]

delete_svi:
  primary:
    lines: ["no interface Vlan{vlan_id}"]

set_svi_admin_state:
  enabled:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["no shutdown"]
  disabled:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["shutdown"]

set_svi_description:
  set:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["description {description}"]
  clear:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["no description"]

# {ipv4_addr}/{ipv4_mask} ya vienen separados (máscara punteada, no CIDR) --
# la conversión CIDR->máscara es cómputo real, la hace el driver en Python,
# no este YAML.
set_svi_ipv4:
  set:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["ip address {ipv4_addr} {ipv4_mask}"]
  clear:
    # Sin argumentos -- "no ip address" a secas borra cualquier dirección
    # configurada, no hace falta (ni se puede, si no la conocemos) repetir
    # la IP actual.
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["no ip address"]

# RF-INTERV-03: IP secundaria (requiere que ya haya una primaria -- lo
# valida SVI antes de llegar acá). A diferencia de la primaria,
# limpiar necesita repetir la dirección exacta -- "no ip address" a secas
# borraría la primaria Y todas las secundarias, no solo esta.
set_svi_ipv4_secondary:
  set:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["ip address {ipv4_addr} {ipv4_mask} secondary"]
  clear:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["no ip address {ipv4_addr} {ipv4_mask} secondary"]

# Cisco sí acepta CIDR directo para IPv6 (a diferencia de IPv4). Precondición
# de device, no manejada acá: requiere "ipv6 unicast-routing" habilitado
# globalmente -- confirmar que ya está antes de asumir que esto va a andar.
set_svi_ipv6:
  set:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["ipv6 address {ipv6_address}"]
  clear:
    # Mismo criterio que IPv4: "no ipv6 address" a secas borra todas las
    # direcciones IPv6 de la interfaz.
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["no ipv6 address"]

# {direction} = "in" | "out". Asigna una ACL que ya existe en el device, no
# la crea (eso es RF-GLOBAL-04, aparte).
set_svi_acl:
  set:
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["ip access-group {acl_name} {direction}"]
  clear:
    # Solo 1 ACL por sentido puede estar asignada a la vez -- alcanza con
    # el sentido para sacarla, no hace falta repetir el nombre.
    primary:
      parents: "interface Vlan{vlan_id}"
      lines: ["no ip access-group {direction}"]

# {servers} es la lista completa de relay servers (SVI arma el
# full-replace antes de llegar acá -- RF-INTERV-05 es incremental a nivel
# API, full-replace a nivel CLI). "repeat" arma 1 "ip helper-address {ip}"
# por cada elemento, después del "no ip helper-address" fijo.
#
# "match: none" es necesario -- bug real encontrado contra el device de
# lab: el diffing por default de ios_config ("match: line") compara contra
# una foto de la running-config tomada ANTES del batch, así que "saltea"
# reenviar una "ip helper-address X" que ya ve configurada, sin darse
# cuenta de que el "no ip helper-address" de esta misma llamada la va a
# borrar -- el resultado real era que solo sobrevivía el último server
# agregado, no el full-replace completo.
set_svi_dhcp_relay:
  primary:
    parents: "interface Vlan{vlan_id}"
    lines: ["no ip helper-address"]
    match: "none"
    repeat:
      over: "servers"
      line: "ip helper-address {item}"

# 2 comandos: el running-config de cada interfaz Vlan (tiene ip/ipv6
# address, description, access-group, helper-address) + el estado
# admin/protocolo (running-config no lo expone). Parseo en
# services/parsers/svi_parser.py -- igual que el resto de los
# parsers, esto necesita confirmarse contra output real de un device antes
# de darlo por bueno a ciegas.
get_svis:
  primary:
    commands:
      - "show running-config | section ^interface Vlan"
      - "show ip interface brief | include Vlan"

# RF-INTERV-04's "ACL previamente creada... e identificador válido" --
# confirmado contra el device real de lab: "Standard/Extended IP access
# list <nombre-o-número>" por cada ACL configurada. Parseo en
# services/parsers/svi_parser.py.
list_acls:
  primary:
    commands:
      - "show access-lists"

# RF-GLOBAL-05 -- confirmado en vivo contra cisco01 (crear ACL de prueba
# con 4 reglas variadas, agregarle 1 más, sacar 1 puntual, borrarla
# completa). "ip access-list extended {name}" crea la ACL si no existía Y
# agrega las líneas si ya existía -- mismo comando para "crear"/"agregar
# reglas", solo cambia qué hay en "rule_lines" (armadas en Python por
# ``CiscoVendor.formatear_regla_acl()``, no acá -- son texto CLI ya
# completo, no hay placeholders individuales por regla).
create_or_update_acl:
  primary:
    parents: "ip access-list extended {name}"
    lines: []
    repeat:
      over: "rule_lines"
      line: "{item}"

# "no {regla exacta, sin número de secuencia}" adentro del contexto de la
# ACL saca esa entrada puntual -- confirmado en vivo.
remove_acl_rules:
  primary:
    parents: "ip access-list extended {name}"
    lines: []
    repeat:
      over: "rule_lines"
      line: "no {item}"

delete_acl:
  primary:
    lines: ["no ip access-list extended {name}"]

# RF-GLOBAL-01/03/07 (SRS §3.4) -- confirmado contra cisco01/f3r9s1
# reales. "show running-config | include snmp-server community" no falla
# si no hay ninguna configurada (devuelve vacío, no error) -- a diferencia
# de "show snmp" (ver get_snmp_status más abajo), por eso vive acá en la
# misma tanda y no aparte.
get_global_config:
  primary:
    commands:
      - "show version"
      - "show running-config | include hostname"
      - "show running-config | include snmp-server community"
      - "show ip route"
      - "show running-config"

# Aparte de get_global_config: "show snmp" falla con rc != 0
# ("%SNMP agent not enabled") cuando SNMP no está configurado -- confirmado
# contra cisco01 real (deshabilitado) y f3r9s1 real (habilitado). Si viviera
# en la misma tanda que el resto, un device sin SNMP tiraría todo el batch
# abajo y se perdería version/hostname/routes también (confirmado: _leer()
# aborta el batch entero ante el primer comando fallido). El driver
# (get_global_config()) atrapa el RuntimeError acá y lo traduce a
# snmp_enabled=False en vez de propagar el error.
get_snmp_status:
  primary:
    commands:
      - "show snmp"

# RF-GLOBAL-08 -- "hostname" es un comando de nivel global, no anidado
# bajo ninguna interfaz (mismo criterio que delete_vlan: "lines" sin
# "parents").
set_hostname:
  primary:
    lines: ["hostname {hostname}"]

# RF-GLOBAL-07 -- confirmado en vivo contra cisco01: "snmp-server community
# {community} {permission}" habilita SNMP y fija la community en 1 sola
# línea. No hay entrada "set_snmp_version" acá a propósito -- IOS clásico
# (SNMPv1/v2c basado en community) no tiene un comando separado para fijar
# la versión, ambas se aceptan implícitamente en cuanto hay una community
# configurada (ver ``CiscoVendor.set_snmp()``, que ignora "version" para
# este vendor).
set_snmp_community:
  primary:
    lines: ["snmp-server community {community} RO"]

# RF-GLOBAL-07 -- confirmado en vivo contra f3r9s1 (aplicado idempotente
# contra los valores ya vigentes ahí, config real de producción). "source"
# es la interfaz de administración del device (ver config real: "snmp-server
# trap-source Vlan156"). "trap-host" necesita la community en texto plano
# en la misma línea (IOS la re-cifra/oculta al mostrarla, no al recibirla).
set_snmp_trap_source:
  primary:
    lines: ["snmp-server trap-source {interface}"]

set_snmp_trap_host:
  primary:
    lines: ["snmp-server host {host} version {version} {community}"]

# RF-GLOBAL-07 (trap host, delete) -- confirmado en vivo contra f3r9s1 que
# "no snmp-server host {ip}" solo ("no snmp-server host {ip} traps" tampoco)
# sale "% Incomplete command" -- IOS exige un completor, y la community es
# el único que no depende de otro estado (traps/informs/version/vrf no
# identifican la entrada por sí solos). "no snmp-server host {ip} {community}"
# sí saca la entrada completa, confirmado con show running-config después.
remove_snmp_trap_host:
  primary:
    lines: ["no snmp-server host {host} {community}"]

# DNS como endpoint propio (RF-GLOBAL-09 split) -- "ip name-server"
# ya confirmado esta sesión; "no ip name-server" también (con la salvedad
# ya documentada de que IOS a veces responde con un mensaje que Ansible
# toma como error aunque el comando sí aplicó -- ver nota de sesión sobre
# f3r9s1). "ip domain-name" confirmado en vivo contra f3r9s1 -- IOS lo
# normaliza a "ip domain name" (2 palabras) en el running-config, pero
# acepta el alias con guión al escribir.
add_dns:
  primary:
    lines: ["ip name-server {server}"]

remove_dns:
  primary:
    lines: ["no ip name-server {server}"]

set_dns_domain:
  primary:
    lines: ["ip domain-name {domain}"]

# Log como endpoint propio (RF-GLOBAL-09 split) -- confirmado en vivo
# contra cisco01. "logging trap {level}" es un ajuste global independiente
# del host en IOS (a diferencia de VRP, donde va atado a la línea del
# loghost) -- igual viaja en la misma request que "logging host" por
# conveniencia de API. "no logging host" confirmado (con la salvedad ya
# documentada de que IOS a veces responde con un mensaje que Ansible toma
# como error aunque el comando sí aplicó).
set_log_host:
  primary:
    lines: ["logging host {log_server}"]

set_log_host_and_level:
  primary:
    lines: ["logging host {log_server}", "logging trap {log_level}"]

remove_log_host:
  primary:
    lines: ["no logging host {log_server}"]

# RF-GLOBAL-06 -- confirmado en vivo contra cisco01. IOS pide máscara
# punteada, no CIDR ni largo de prefijo (``network``/``mask`` ya vienen
# convertidos desde el driver, ver ``VendorDriver._red_y_mascara()``).
set_route:
  primary:
    lines: ["ip route {network} {mask} {next_hop}"]

# RF-GLOBAL-06 (delete) -- mismo comando que set_route con "no" adelante,
# ya confirmado en vivo esta sesión (se usó para el cleanup manual de las
# pruebas de set_route).
remove_route:
  primary:
    lines: ["no ip route {network} {mask} {next_hop}"]

# RF-GLOBAL-09 (NTP, endpoint propio) -- confirmado en vivo contra f3r9s1:
# "ntp server {ip} prefer" (con o sin "prefer") y "no ntp server {ip}" (el
# remove NO necesita "prefer" para matchear, confirmado quitando una
# entrada agregada CON prefer usando el comando sin el sufijo).
add_ntp_with_prefer:
  primary:
    lines: ["ntp server {server} prefer"]

add_ntp:
  primary:
    lines: ["ntp server {server}"]

remove_ntp:
  primary:
    lines: ["no ntp server {server}"]
