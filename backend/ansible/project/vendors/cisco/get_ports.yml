---
# Step 1.3 — Port visibility on Cisco IOS devices.
#
# Read-only.  A single `ios_command` task issues the three required
# commands and Ansible returns their stdouts as a list — element [0] is
# `show interfaces status`, [1] is `show interfaces description`, [2] is
# `show interfaces switchport`.
#
# The shared `_extract_all_command_outputs()` helper in `ansible_service`
# expands the list-shaped stdout into the `stdouts` array the driver
# consumes (same shape used by the Huawei driver).

- name: Get port inventory from Cisco IOS device
  hosts: all
  gather_facts: no

  tasks:
    - name: Collect port read commands
      cisco.ios.ios_command:
        commands:
          - show interfaces status
          - show interfaces description
          - show interfaces switchport
      register: ports_output
