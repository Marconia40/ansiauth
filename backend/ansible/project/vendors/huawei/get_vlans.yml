---
- name: Get VLANs from Huawei VRP device
  hosts: all
  gather_facts: no

  tasks:
    - name: Display VLAN information
      community.network.ce_command:
        commands:
          - display vlan
      register: vlan_output

    - name: Return VLAN output
      debug:
        msg: "{{ vlan_output.stdout[0] }}"
