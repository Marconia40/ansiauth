---
# Set trunk native VLAN on Cisco IOS.
#
# The port must already be in trunk mode (enforced by the orchestration layer).
# Runs `switchport trunk native vlan {{ vlan_id }}` inside the interface context.
#
# Vars expected:
#   interface (str)
#   vlan_id   (int)
#   device    (str) — diagnostic only

- name: Set trunk native VLAN on Cisco IOS device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply trunk native VLAN
      cisco.ios.ios_config:
        parents: "interface {{ interface }}"
        lines:
          - "switchport trunk native vlan {{ vlan_id }}"
        save_when: always
