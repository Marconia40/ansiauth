---
# Single generic playbook for every Cisco IOS operation — mutations run
# through `lines`/`parents` (cisco.ios.ios_config), reads and bare exec
# commands (including `write`, used by save_config()) run through
# `commands` (cisco.ios.ios_command). Replaces the 12 near-identical
# per-operation playbooks this used to be split across — the only thing
# that varied between them was the content of `lines`/`commands`, which
# now lives in the Python driver instead.
#
# Vars expected (mutually exclusive):
#   parents (str, optional) — config-mode parent context, e.g.
#     "interface GigabitEthernet0/0/1" or "vlan 100". Omitted for
#     global-level lines (e.g. "no vlan 100").
#   lines   (list[str]) — config lines to apply.
#   match   (str, optional) — ios_config's idempotency-diff mode. Default
#     ("line") lets the module skip re-sending a line it already sees in
#     the current running-config -- fine for most operations, but a real
#     bug found against the lab device for "no X" + "re-add all" full-
#     replace patterns (RF-INTERV-05 DHCP relay): the module diffs against
#     a config SNAPSHOT taken before the batch runs, so it skips re-adding
#     a line that's "already there" without accounting for an earlier "no"
#     line in the SAME batch that's about to remove it -- net effect, only
#     the last item of a multi-line full-replace survives. Callers that
#     need every line sent unconditionally (full-replace intents) pass
#     "none" here.
#   commands (list[str]) — exec-mode commands to run (reads, or `write`).
#   config_steps (list[dict], keys parents/lines/match — same meaning as
#     above, per item) — batching de N mutaciones independientes en 1 sola
#     conexión (base.py:aplicar_lote()). Ansible reusa la conexión entre
#     iteraciones del loop igual que con `lines` (confirmado en vivo: 3
#     steps reales aplicados vía este mecanismo tardaron 4.86s contra
#     9.24s como 3 invocaciones de playbook separadas, mismo device real).
#     No reemplaza `lines`/`parents` (que sigue usando cada operación
#     individual) -- es la forma que usa el camino de batch nuevo.
#   device  (str) — diagnostic only.

- name: Cisco IOS device operation
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply config lines
      when: lines is defined
      cisco.ios.ios_config:
        parents: "{{ parents | default(omit) }}"
        lines: "{{ lines }}"
        match: "{{ match | default(omit) }}"

    - name: Apply config steps batch
      when: config_steps is defined
      cisco.ios.ios_config:
        parents: "{{ item.parents | default(omit) }}"
        lines: "{{ item.lines }}"
        match: "{{ item.match | default(omit) }}"
      loop: "{{ config_steps }}"

    - name: Run commands
      when: commands is defined
      cisco.ios.ios_command:
        commands: "{{ commands }}"
