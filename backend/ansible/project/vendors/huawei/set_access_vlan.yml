---
# Step 2.3 — Set access VLAN on Huawei VRP.
#
# Pre-condition (enforced by the orchestration layer, not here):
#   * the interface is already in `port link-type access` mode.
#   * the VLAN id is in the valid range and not in 1002–1005.
#
# VRP commits are idempotent so re-running with the same target VLAN is
# a no-op; the orchestration layer also short-circuits no-ops via pre-state.
#
# Vars expected:
#   interface (str)
#   vlan_id   (int)
#   device    (str) — diagnostic only

- name: Set access VLAN on Huawei VRP device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply access VLAN
      ansible.netcommon.cli_command:
        command: |
          system-view
          interface {{ interface }}
          port default vlan {{ vlan_id }}
          commit
          quit
          quit
