        - "port trunk pvid vlan {native_vlan}"
        - "undo port trunk allow-pass vlan all"
        - "port trunk allow-pass vlan {allowed_vlans}"
        - "quit"
        - "quit"

# ── SVI, RF-INTERV-* ─────────────────────────────────
# "interface Vlanif{vlan_id}". Reusa el mismo trigger _NO_COMMIT que
# VLAN/puerto en cada operación -- misma plataforma, mismo comportamiento
# de sesión CLI, no hay motivo para que solo algunas operaciones lo
# necesiten.

create_svi:
  primary:
    block: ["system-view", "interface Vlanif{vlan_id}", "undo shutdown", "commit", "quit", "quit"]
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "interface Vlanif{vlan_id}"
        - "undo shutdown"
        - "quit"
        - "quit"

delete_svi:
  primary:
    block: ["system-view", "undo interface Vlanif{vlan_id}", "commit", "quit"]
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "undo interface Vlanif{vlan_id}"
        - "quit"

set_svi_admin_state:
  enabled:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "undo shutdown", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "undo shutdown"
          - "quit"
          - "quit"
  disabled:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "shutdown", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "shutdown"
          - "quit"
          - "quit"

set_svi_description:
  set:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "description {description}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
