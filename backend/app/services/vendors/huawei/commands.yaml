# Confirmado contra el device real de lab (running-config visto esta
# sesión: "interface Vlanif10 / ip address 10.10.10.10 255.255.255.0").
# {ipv4_addr}/{ipv4_mask} ya vienen separados (máscara punteada) -- la
# conversión CIDR->máscara es cómputo real, la hace el driver en Python.
set_svi_ipv4:
  set:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "ip address {ipv4_addr} {ipv4_mask}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "ip address {ipv4_addr} {ipv4_mask}"
          - "quit"
          - "quit"
  clear:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "undo ip address", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "undo ip address"
          - "quit"
          - "quit"

# RF-INTERV-03: IP secundaria -- VRP llama "sub" a esto, confirmado contra
# config real de producción (ver ejemplo de Vlanif832 en la nota de
# set_svi_ipv6 más abajo -- misma interfaz, "ip address ... sub").
# Requiere primaria existente (lo valida SVI antes de llegar
# acá).
set_svi_ipv4_secondary:
  set:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "ip address {ipv4_addr} {ipv4_mask} sub", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "ip address {ipv4_addr} {ipv4_mask} sub"
          - "quit"
          - "quit"
  clear:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "undo ip address {ipv4_addr} {ipv4_mask} sub", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "undo ip address {ipv4_addr} {ipv4_mask} sub"
          - "quit"
          - "quit"

# Confirmado contra config real de producción (interface Vlanif832):
#   ipv6 enable
#   ip address 200.16.26.129 255.255.255.128
#   ip address 172.23.112.1 255.255.255.0 sub
#   ipv6 address 2801:120:832::1/64
# "ipv6 enable" hace falta antes de poder asignar la dirección (a
# diferencia de Cisco, que solo necesita "ipv6 unicast-routing" global) --
# pero a diferencia del IPv4 de esta misma plataforma, ipv6 SÍ va en CIDR
# de un tirón, igual que Cisco (no separado addr+prefix-length).
set_svi_ipv6:
  set:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "ipv6 enable", "ipv6 address {ipv6_address}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "ipv6 enable"
          - "ipv6 address {ipv6_address}"
          - "quit"
          - "quit"
  clear:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "undo ipv6 address", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "undo ipv6 address"
          - "quit"
          - "quit"

# Confirmado EN VIVO contra f3r9s2 real (probado con "traffic-filter ?" /
# "acl ?" en el contexto de la interfaz, y aplicado + verificado por
# "display current-configuration interface" antes de revertir): el orden
# de "traffic-filter" es SIEMPRE "{direction}bound acl ..." -- lo que
# cambia entre numerada y con nombre es que una ACL con nombre necesita el
# keyword literal "name" antes del nombre (una numerada no):
#   traffic-filter inbound acl 3002                  (numerada)
#   traffic-filter inbound acl name test-acl          (con nombre)
# El comentario anterior ("traffic-filter acl {nombre} {direction}bound")
# estaba mal -- esa forma no existe, el device la rechaza con "Wrong
# parameter"/"Unrecognized command" según dónde se corte. driver.py decide
# "set_numeric" vs "set_named" según acl_name.isdigit(). Asigna una ACL
# que ya existe en el device, no la crea (RF-GLOBAL-04, aparte).
set_svi_acl:
  set_numeric:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "traffic-filter {direction}bound acl {acl_name}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "traffic-filter {direction}bound acl {acl_name}"
          - "quit"
          - "quit"
  set_named:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "traffic-filter {direction}bound acl name {acl_name}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "traffic-filter {direction}bound acl name {acl_name}"
          - "quit"
          - "quit"
  # "undo traffic-filter {direction}bound" solo (sin la ACL) -- lo que
  # tenía este bloque antes -- es "Incomplete command": confirmado en vivo
  # que VRP exige repetir la referencia EXACTA que está atada, mismo
  # keyword "name" que en el set (driver.py decide clear_numeric/
  # clear_named sobre el valor ACTUAL leído por reconciliar(), no sobre el
  # nuevo valor vacío que dispara el clear).
  clear_numeric:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "undo traffic-filter {direction}bound acl {acl_name}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "undo traffic-filter {direction}bound acl {acl_name}"
          - "quit"
          - "quit"
  clear_named:
    primary:
      block: ["system-view", "interface Vlanif{vlan_id}", "undo traffic-filter {direction}bound acl name {acl_name}", "commit", "quit", "quit"]
    alternatives:
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface Vlanif{vlan_id}"
          - "undo traffic-filter {direction}bound acl name {acl_name}"
          - "quit"
          - "quit"

# {servers} es la lista completa de relay servers (SVI arma el
# full-replace antes de llegar acá -- RF-INTERV-05 es incremental a nivel
# API, full-replace a nivel CLI). Hay 2 formas reales confirmadas, y varían
# por plataforma -- primary intenta la forma directa, alternatives cubre
# tanto el "sin commit" ya conocido como la forma por "server group" para
# las plataformas que rechazan la directa.
#
# FORMA DIRECTA (primary) -- "dhcp select relay" (una vez, solo si la
# lista no está vacía) + "dhcp relay server-ip {ip}" por cada elemento,
# después del "undo dhcp select relay" fijo que limpia cualquier config
# previa. Confirmada contra config real de un device de producción.
#
# FORMA POR "SERVER GROUP" (2da alternativa) -- confirmada contra el
# MISMO device de producción (coexisten, se elige una u otra por
# interfaz) Y contra el CE12800 de lab (donde la forma directa NO existe
# -- "dhcp relay ?" ahí no lista "server-ip", pero "dhcp relay server
# group" sí). El grupo es un objeto GLOBAL (fuera del contexto de
# interfaz) con nombre propio -- acá se genera uno determinístico por
# VLAN ("ansiauth-vlan{vlan_id}") para no necesitar estado extra ni
# compartir grupos entre interfaces (que es para lo que Huawei pensó esta
# forma, pero no encaja con el modelo por-interfaz de RF-INTERV-05):
#   dhcp relay server group ansiauth-vlan{vlan_id}
#    server {ip} {index}          -- {index} 0-based, "INTEGER<0-19>" confirmado (máx 20 por grupo en el CE12800)
#   interface Vlanif{vlan_id}
#    dhcp select relay
#    dhcp relay binding server group ansiauth-vlan{vlan_id}
# Full-replace real y confirmado contra el device de lab (setup -> setup
# de nuevo con otra lista -> clear, las 3 veces funcionando en secuencia):
# hace falta desvincular ANTES de poder borrar/recrear el grupo (si no,
# "Error: The DHCP server group is used on the interface N time(s)"), por
# eso el "undo dhcp relay binding server group" (sin nombre -- con nombre
# da "Too many parameters") va primero, incondicional.
#
# Limitación conocida: la 2da alternativa asume que además de rechazar la
# forma directa, el device SÍ soporta commit -- si algún device rechaza
# ambas cosas a la vez, el mecanismo de alternatives (1 solo reintento, no
# encadena) no lo cubre todavía. No confirmado que ese caso exista.
# El "undo dhcp relay binding server group" + "undo dhcp relay server
# group ansiauth-vlan{vlan_id}" va INCONDICIONAL en el primary (y su
# alternativa sin-commit), no solo en la alternativa por grupo -- bug real
# encontrado probando el clear completo (lista vacía): como el "clear" de
# la forma directa nunca manda una línea "dhcp relay server-ip" (no hay
# nada que dispare el trigger de la 2da alternativa), la forma directa
# "tiene éxito" trivialmente en un device que en realidad venía usando la
# forma por grupo -- el reintento nunca se dispara y el binding viejo
# queda colgado. Confirmado que "undo dhcp relay binding server group"
# es inofensivo cuando nunca hubo nada bindeado (probado en una interfaz
# recién creada, sin ningún dhcp relay configurado todavía).
set_svi_dhcp_relay:
  primary:
    block:
      - "system-view"
      - "interface Vlanif{vlan_id}"
      - "undo dhcp select relay"
      - "undo dhcp relay binding server group"
      - "quit"
      - "undo dhcp relay server group ansiauth-vlan{vlan_id}"
      - "interface Vlanif{vlan_id}"
    repeat:
      over: "servers"
      prefix_if_nonempty: ["dhcp select relay"]
      line: "dhcp relay server-ip {item}"
    trailer: ["commit", "quit", "quit"]
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "interface Vlanif{vlan_id}"
        - "undo dhcp select relay"
        - "undo dhcp relay binding server group"
        - "quit"
        - "undo dhcp relay server group ansiauth-vlan{vlan_id}"
        - "interface Vlanif{vlan_id}"
      repeat:
        over: "servers"
        prefix_if_nonempty: ["dhcp select relay"]
        line: "dhcp relay server-ip {item}"
      trailer: ["quit", "quit"]
    - triggered_by_error: 'dhcp relay server-ip \S+\r?\n\s*\^\r?\nError: (?:Unrecognized|Incomplete) command'
      block:
        - "system-view"
        - "interface Vlanif{vlan_id}"
        - "undo dhcp relay binding server group"
        - "quit"
        - "undo dhcp relay server group ansiauth-vlan{vlan_id}"
      repeat:
        over: "servers"
        prefix_if_nonempty: ["dhcp relay server group ansiauth-vlan{vlan_id}"]
        line: "server {item} {index}"
        suffix_if_nonempty:
          - "quit"
          - "interface Vlanif{vlan_id}"
          - "dhcp select relay"
          - "dhcp relay binding server group ansiauth-vlan{vlan_id}"
        if_empty:
          - "interface Vlanif{vlan_id}"
          - "undo dhcp select relay"
      trailer: ["commit", "quit", "quit"]
    - triggered_by_error: 'dhcp relay (?:binding server group|server group ansiauth-vlan\d+)\r?\n\s*\^\r?\nError: Unrecognized command'
      # Confirmado en vivo contra f3r9s2 (S5731, VRP V200R022C00SPC500):
      # el device soporta perfectamente la forma directa ("dhcp select
      # relay" + "dhcp relay server-ip {ip}", verificado aplicando y
      # leyendo el running-config resultante) pero NO TIENE en absoluto
      # el comando "dhcp relay server group" (ni "?" lo reconoce) -- a
      # diferencia del CE12800 de lab, donde ambas formas coexisten y el
      # cleanup incondicional de arriba (comentario en `primary`) es
      # inofensivo. Acá esas 2 líneas de limpieza rechazan con
      # "Unrecognized command" y tumban el bloque ENTERO antes de llegar
      # a la línea real -- ni siquiera un simple "agregar 1 servidor"
      # llega a ejecutarse. Esta alternativa es la forma directa sin
      # ningún cleanup de "server group" (nada que limpiar en un device
      # que nunca soportó esa forma). Sin "commit" en el trailer -- 2do
      # bug encontrado probando en vivo: con "servers" vacío (remove del
      # único server) el trailer corre TODAVÍA dentro del contexto de
      # interfaz (``[f3r9s2-Vlanif20]commit``, no llegó a hacer "quit"
      # antes), y ESTE device específicamente rechaza "commit" ahí adentro
      # (mismo síntoma que ``alt[0]`` ya cubre para otros devices, pero acá
      # hacen falta AMBOS fixes a la vez -- el mecanismo de alternatives no
      # encadena una 2da alternativa sobre el error de la 1ra). Confirmado
      # con pruebas crudas que "dhcp select relay"/"dhcp relay server-ip"
      # se aplican y persisten en el running-config sin ningún "commit".
      block:
        - "system-view"
        - "interface Vlanif{vlan_id}"
        - "undo dhcp select relay"
      repeat:
        over: "servers"
        prefix_if_nonempty: ["dhcp select relay"]
        line: "dhcp relay server-ip {item}"
      trailer: ["quit", "quit"]

# RF-INTERV-04's "ACL previamente creada... e identificador válido" --
# "Total nonempty ACL number is 0" confirmado contra el device real de lab
# (estado vacío). El formato de encabezado con ACLs reales configuradas
# ("Basic/Advanced ACL <num>, N rules" para numeradas, "Basic/Advanced
# Name ACL <nombre>, N rules" para con nombre -- la palabra "Name" extra
# solo aparece en ese caso) confirmado aparte contra config real de un
# device de producción (parseo en svi_parser.py).
list_acls:
  primary:
    commands:
      - "display acl all"

# RF-GLOBAL-05 -- confirmado en vivo contra huawei01 (crear ACL Advanced
# de prueba, agregarle 4 reglas variadas, sacar 1 puntual, borrarla
# completa). "acl name {name} advance" crea la ACL Advanced con nombre si
# no existía Y agrega las reglas si ya existía -- mismo comando para
# "crear"/"agregar reglas" (mismo criterio que Cisco). "rule_lines" ya
# viene formateado por ``HuaweiVendor.formatear_regla_acl()`` -- ojo que
# ese formateo OMITE "source any"/"destination any" (no los escribe) para
# que coincida con cómo VRP los devuelve al leer (confirmado en vivo: un
# endpoint "any" desaparece completo de la línea, no queda "source any"
# ni nada equivalente -- si no se replica esto, la detección de no-op
# nunca matchea).
# "screen-width 512" al principio de la sesión evita el bug de corrupción
# de terminal (una secuencia ANSI de cursor-izquierda parte el comando a
# la mitad de una palabra cuando el prompt + la línea de la regla cruzan
# el ancho de la terminal) -- confirmado en vivo contra f3r9s2 real: sin
# esto, "rule permit tcp destination 192.0.2.10 0 destination-port eq
# 443" se corrompía; con "screen-width 512" primero, la misma línea
# aplica limpia. Confirmado además que NO queda guardado en el
# running-config (es un ajuste de terminal de la sesión, no config real).
# "y" contesta el prompt de confirmación ("Warning: This command will
# change the default screen width. Continue? [Y/N]:").
#
# PERO "screen-width" no existe en todas las familias VRP -- confirmado
# en vivo que huawei01 (CE12800) lo rechaza con "Unrecognized command",
# mientras que f3r9s2 (S5731) sí lo tiene. La 1ra alternativa cubre esa
# plataforma (reintenta sin screen-width, con commit -- mismo
# comportamiento que esta operación tenía antes de este fix). La 2da
# alternativa cubre la plataforma que SÍ tiene screen-width pero rechaza
# "commit" (f3r9s2 real) -- reintenta con screen-width, sin commit.
create_or_update_acl:
  primary:
    block:
      - "screen-width 512"
      - "y"
      - "system-view"
      - "acl name {name} advance"
    repeat:
      over: "rule_lines"
      line: "{item}"
    trailer: ["quit", "commit", "quit"]
  alternatives:
    - triggered_by_error: 'screen-width 512\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "acl name {name} advance"
      repeat:
        over: "rule_lines"
        line: "{item}"
      trailer: ["quit", "commit", "quit"]
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "screen-width 512"
        - "y"
        - "system-view"
        - "acl name {name} advance"
      repeat:
        over: "rule_lines"
        line: "{item}"
      trailer: ["quit", "quit"]

# "undo rule {regla exacta, sin número de secuencia}" adentro del contexto
# de la ACL saca esa entrada puntual -- confirmado en vivo. Mismo
# criterio de "screen-width 512" + 2 alternativas que
# ``create_or_update_acl`` -- ver esa nota arriba.
remove_acl_rules:
  primary:
    block:
      - "screen-width 512"
      - "y"
      - "system-view"
      - "acl name {name} advance"
    repeat:
      over: "rule_lines"
      line: "undo {item}"
    trailer: ["quit", "commit", "quit"]
  alternatives:
    - triggered_by_error: 'screen-width 512\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "acl name {name} advance"
      repeat:
        over: "rule_lines"
        line: "undo {item}"
      trailer: ["quit", "commit", "quit"]
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "screen-width 512"
        - "y"
        - "system-view"
        - "acl name {name} advance"
      repeat:
        over: "rule_lines"
        line: "undo {item}"
      trailer: ["quit", "quit"]

# "undo acl name {name}" desde system-view borra la ACL completa -- no
# hace falta entrar a su contexto primero. Confirmado en vivo.
delete_acl:
  primary:
    block:
      - "system-view"
      - "undo acl name {name}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "undo acl name {name}"
        - "quit"

# RF-GLOBAL-01/03/08 (SRS §3.4) -- confirmado contra huawei01/f3r9s2
# reales. "sysname" vía grep no falla si no hay match (vacío, no error) --
# a diferencia de "display snmp-agent sys-info" (ver get_snmp_status más
# abajo), por eso vive en la misma tanda.
get_global_config:
  primary:
    commands:
      - "display version"
      - "display current-configuration | include sysname"
      - "display ip routing-table"
      - "display current-configuration"

# Aparte de get_global_config: "display snmp-agent sys-info" falla con
# rc != 0 ("Error: SNMP agent is not enabled.") cuando SNMP no está
# configurado -- confirmado contra huawei01 real (deshabilitado). Mismo
# motivo que en Cisco (ver get_snmp_status de cisco/commands.yaml) para
# tenerlo aparte: si viviera en la misma tanda, un device sin SNMP tiraría
# todo el batch abajo. El formato de la línea de community SNMP en VRP
# (para cuando SÍ está habilitado) no está confirmado todavía -- ningún
# device de esta sesión lo tiene activo.
get_snmp_status:
  primary:
    commands:
      - "display snmp-agent sys-info"

# RF-GLOBAL-08 -- mismo criterio de 2 alternativas (con/sin "commit") que
# create_vlan/delete_vlan de este mismo archivo.
set_hostname:
  primary:
    block:
      - "system-view"
      - "sysname {hostname}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "sysname {hostname}"
        - "quit"

# RF-GLOBAL-07 -- confirmado en vivo contra huawei01 (lab, CE12800):
# "snmp-agent sys-info version {v1|v2c|v3}" es ADITIVO (agrega esa versión a
# las ya habilitadas, no reemplaza -- ver docstring de
# ``HuaweiVendor.set_snmp()``), y "snmp-agent community {read|write}
# {community}" (no hay sufijo de permiso como en Cisco, el verbo YA es el
# permiso). Separados en 2 templates porque la request puede traer solo
# 1 de los 2 (version sin community, o viceversa) -- el driver decide cuál
# invocar según qué llegó, mismo criterio 1-call-por-pieza que set_hostname.
set_snmp_version:
  primary:
    block:
      - "system-view"
      - "snmp-agent sys-info version {version}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "snmp-agent sys-info version {version}"
        - "quit"

set_snmp_community:
  primary:
    block:
      - "system-view"
      - "snmp-agent community {verbo} {community}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "snmp-agent community {verbo} {community}"
        - "quit"

# RF-GLOBAL-07 -- confirmado en vivo contra f3r9s2 (aplicado y revertido,
# no había trap-source configurado antes así que fue una prueba real sin
# efecto en producción). "trap-host" NO tiene entrada acá a propósito --
# ver docstring de ``HuaweiVendor.set_snmp()`` (comando real >100
# caracteres, se corrompe en tránsito sobre esta sesión SSH).
set_snmp_trap_source:
  primary:
    block:
      - "system-view"
      - "snmp-agent trap source {interface}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "snmp-agent trap source {interface}"
        - "quit"

# RF-GLOBAL-09 -- confirmado en vivo contra huawei01. "ntp unicast-server"
# (SIN "-service", a diferencia del nombre del feature) y "dns server"
# requieren "dns resolve" antes (habilita la resolución DNS del propio
# device, sin eso "dns server" queda configurado pero inactivo). El nivel
# de severidad del log ("level") va DENTRO de la misma línea que el host
# de "info-center loghost" -- no es un ajuste global separado como en IOS,
# por eso hay 2 variantes (con/sin level) en vez de 1 template + 1 aparte.
# NTP como endpoint propio (RF-GLOBAL-09 split) -- "prefer" no tiene
# equivalente confirmado en VRP (sin device de lab disponible para probar
# "ntp unicast-server {ip} ?" al momento de esta vuelta) -- el driver lo
# ignora con un log si viene, mismo criterio que "version" en set_snmp
# para Cisco. Confirmar en cuanto el lab esté disponible.
add_ntp:
  primary:
    block:
      - "system-view"
      - "ntp unicast-server {server}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "ntp unicast-server {server}"
        - "quit"

remove_ntp:
  primary:
    block:
      - "system-view"
      - "undo ntp unicast-server {server}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "undo ntp unicast-server {server}"
        - "quit"

# DNS como endpoint propio (RF-GLOBAL-09 split) -- "dns server"/"dns
# resolve" ya confirmados esta sesión. "dns domain" confirmado en vivo
# contra f3r9s2 (ya se ve tal cual en su running-config real). "undo dns
# server" también confirmado (cleanup de pruebas anteriores).
add_dns:
  primary:
    block:
      - "system-view"
      - "dns resolve"
      - "dns server {server}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "dns resolve"
        - "dns server {server}"
        - "quit"

remove_dns:
  primary:
    block:
      - "system-view"
      - "undo dns server {server}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "undo dns server {server}"
        - "quit"

set_dns_domain:
  primary:
    block:
      - "system-view"
      - "dns domain {domain}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "dns domain {domain}"
        - "quit"

# Log como endpoint propio (RF-GLOBAL-09 split) -- "info-center loghost
# {ip}" confirmado en vivo. El nivel de severidad se sacó de esta línea
# (ver ``HuaweiVendor.add_log_server()``): la forma "info-center loghost
# {ip} level {level}" existe en huawei01 (CE12800 lab) pero f3r9s2
# (S-series real) la rechaza ("Error:Too many parameters found") -- en vez
# de mantener 2 variantes con/sin level, ahora el nivel siempre va por
# ``set_log_channel_level`` (canal 2 = "loghost", confirmado con ``display
# channel``), que sí funciona en ambos.
add_log_host:
  primary:
    block:
      - "system-view"
      - "info-center loghost {server}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "info-center loghost {server}"
