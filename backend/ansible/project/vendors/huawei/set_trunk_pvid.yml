---
# Set trunk native VLAN (PVID) on Huawei VRP.
#
# The port must already be in trunk mode (enforced by the orchestration layer).
# Runs `port trunk pvid vlan {{ vlan_id }}` inside the interface view,
# followed by `commit`.
#
# Vars expected:
#   interface (str)
#   vlan_id   (int)
#   device    (str) — diagnostic only

- name: Set trunk PVID on Huawei VRP device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply trunk native VLAN (PVID)
      ansible.netcommon.cli_command:
        command: |
          system-view
          interface {{ interface }}
          port trunk pvid vlan {{ vlan_id }}
          commit
          quit
          quit
