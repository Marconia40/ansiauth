---
# Single generic playbook for every Cisco IOS operation — mutations run
# through `lines`/`parents` (cisco.ios.ios_config), reads and bare exec
# commands (including `write`, used by save_config()) run through
# `commands` (cisco.ios.ios_command). Replaces the 12 near-identical
# per-operation playbooks this used to be split across — the only thing
# that varied between them was the content of `lines`/`commands`, which
# now lives in the Python driver instead.
#
# Vars expected (mutually exclusive):
#   parents (str, optional) — config-mode parent context, e.g.
#     "interface GigabitEthernet0/0/1" or "vlan 100". Omitted for
#     global-level lines (e.g. "no vlan 100").
#   lines   (list[str]) — config lines to apply.
#   match   (str, optional) — ios_config's idempotency-diff mode. Default
#     ("line") lets the module skip re-sending a line it already sees in
#     the current running-config -- fine for most operations, but a real
#     bug found against the lab device for "no X" + "re-add all" full-
#     replace patterns (RF-INTERV-05 DHCP relay): the module diffs against
#     a config SNAPSHOT taken before the batch runs, so it skips re-adding
#     a line that's "already there" without accounting for an earlier "no"
#     line in the SAME batch that's about to remove it -- net effect, only
#     the last item of a multi-line full-replace survives. Callers that
#     need every line sent unconditionally (full-replace intents) pass
#     "none" here.
#   commands (list[str]) — exec-mode commands to run (reads, or `write`).
#   config_steps (list[dict], keys parents/lines/match — same meaning as
#     above, per item) — batching de N mutaciones independientes en 1 sola
#     conexión (base.py:aplicar_lote()). Ansible reusa la conexión entre
#     iteraciones del loop igual que con `lines` (confirmado en vivo: 3
#     steps reales aplicados vía este mecanismo tardaron 4.86s contra
#     9.24s como 3 invocaciones de playbook separadas, mismo device real).
#     No reemplaza `lines`/`parents` (que sigue usando cada operación
#     individual) -- es la forma que usa el camino de batch nuevo.
#   device  (str) — diagnostic only.

- name: Cisco IOS device operation
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply config lines
      when: lines is defined
      cisco.ios.ios_config:
        parents: "{{ parents | default(omit) }}"
        lines: "{{ lines }}"
        match: "{{ match | default(omit) }}"

    - name: Apply config steps batch
      when: config_steps is defined
      cisco.ios.ios_config:
        parents: "{{ item.parents | default(omit) }}"
        lines: "{{ item.lines }}"
        match: "{{ item.match | default(omit) }}"
      loop: "{{ config_steps }}"

    # ── Reads ─────────────────────────────────────────────────────────────
    # 2 tasks distintas para el mismo ios_command, elegidas por el flag
    # tolerate_command_errors (extravar seteado por VendorDriver._leer()
    # cuando el caller pasa partial_ok=True):
    #
    #   - strict (default): comportamiento histórico -- si algún comando
    #     falla ("% Invalid input", "SNMP agent not enabled", etc.) la
    #     task falla y _leer() lanza RuntimeError. Requerido por
    #     get_snmp_status / list_acl_names / cualquier read que use el
    #     error como señal semántica.
    #
    #   - tolerant: failed_when: false hace que la task nunca falle. El
    #     stdout devuelto por ios_command incluye la respuesta de CADA
    #     comando, incluidos los rechazados (con su texto "% Invalid
    #     input..."). El driver Python inspecciona cada slot con
    #     _filter_unsupported() y decide qué tratar como feature ausente.
    #     Usado por list_ports/read_core_state para tolerar devices sin
    #     storm-control (IOSv de GNS3, modelos viejos, etc.).
    #
    # Bug real encontrado en vivo contra un GNS3 IOSv sin storm-control:
    # cuando ios_command detecta "%" en la respuesta, marca la task como
    # failed y devuelve SOLO {"changed": false, "msg": "..."} -- las
    # respuestas de los otros comandos que sí funcionaron NO viajan en el
    # evento, por eso "capturar stdouts del runner_on_failed" no alcanzaba.
    # La única forma de recuperar los outputs es evitar el failure en la
    # task, y eso requiere failed_when: false, que solo tiene sentido cuando
    # el caller pidió explícitamente tolerar.
    - name: Run commands (strict — default)
      when: commands is defined and not (tolerate_command_errors | default(false) | bool)
      cisco.ios.ios_command:
        commands: "{{ commands }}"

    # Loop 1-comando-por-iteración (mismo patrón que huawei/run.yml).
    # Bug real reproducido en vivo contra un IOSv sin storm-control:
    # ios_command con commands: [4 items] + failed_when: false NO devuelve
    # stdout cuando alguno de esos 4 comandos matchea el patrón de error
    # interno del módulo -- la task no falla, pero el res.stdout viene
    # vacío, así que el driver recibía stdouts=[] y volvía a tirar
    # "no command output returned". Con loop, cada comando queda en su
    # propia iteración, Ansible produce res.results[i] con el stdout
    # individual (incluido el texto "% Invalid input" para los rechazados)
    # y _extract_all_command_outputs los saca por posición.
    - name: Run commands (tolerant — per-command errors surface as text)
      when: commands is defined and (tolerate_command_errors | default(false) | bool)
      cisco.ios.ios_command:
        commands:
          - "{{ item }}"
      loop: "{{ commands }}"
      failed_when: false
