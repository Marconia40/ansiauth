---
# Step 2.4 — Set trunk allowed VLANs on Cisco IOS.
#
# `switchport trunk allowed vlan <list>` replaces the current allowed-VLAN
# list atomically in IOS running-config.  `save_when: always` ensures the
# change persists across a device reload.
#
# Pre-condition (enforced by the orchestration layer, not here):
#   * the interface is already in `switchport mode trunk`.
#   * vlan_list is a non-empty, validated, compressed range string.
#
# Vars expected:
#   interface (str)
#   vlan_list (str) — e.g. "10-12,20,30-35"
#   device    (str) — diagnostic only

- name: Set trunk allowed VLANs on Cisco IOS device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply trunk VLAN list
      cisco.ios.ios_config:
        parents: "interface {{ interface }}"
        lines:
          - "switchport trunk allowed vlan {{ vlan_list }}"
        save_when: always
