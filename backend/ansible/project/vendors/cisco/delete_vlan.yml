---
- name: Delete VLAN on Cisco device
  hosts: all
  gather_facts: no

  tasks:
    - name: Remove VLAN
      cisco.ios.ios_config:
        lines:
          - no vlan {{ vlan_id }}
      register: result

# For testing failure handling, uncomment the following block to simulate a failure after configuration changes
#    - name: FORCE FAILURE
#      fail:
#        msg: "Intentional failure after config"

    - name: Save running config
      cisco.ios.ios_config:
        save_when: always
