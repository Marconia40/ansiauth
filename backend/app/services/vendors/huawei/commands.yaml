# Comandos CLI de Huawei VRP por operación. Editar acá para agregar una
# variación descubierta contra un device/modelo real -- no hace falta tocar
# driver.py ni reconstruir el playbook. Cada operación tiene un "primary" y,
# opcionalmente, "alternatives": cada alternativa lleva "triggered_by_error"
# (regex contra stderr+stdout del intento primario) -- si matchea, se
# reintenta una vez con esa alternativa antes de devolver el error real.
# "alternatives" es una lista -- se pueden apilar varias para la misma
# operación, se prueban en orden hasta que una matchee.
#
# "block" es la única forma que usa este vendor (ansible.netcommon.cli_command,
# un solo comando/bloque multi-línea) -- las líneas se unen con "\n" y se
# mandan como una sesión completa (system-view/.../commit/quit según haga
# falta). "y" como línea propia contesta un prompt [Y/N] (ver reset_port).
#
# Placeholders disponibles por operación: ver el método correspondiente en
# driver.py (arma el dict "vars" antes de llamar a _aplicar_desde_template()).
#
# Trigger _NO_COMMIT (reutilizado en varias operaciones abajo): confirmado
# contra un device real de lab (prompt "[rou-aulascomunes-a1]", otra
# familia de plataforma VRP que no usa candidate-config/commit) --
# "commit" mismo sale rechazado con:
#   [prompt]commit
#                ^
#   Error: Unrecognized command found at '^' position.
# El regex ancla específicamente en que la palabra ecoada antes del "^" sea
# "commit" -- no un "Unrecognized command" genérico, que podría venir de
# cualquier otra línea del bloque fallando por una razón totalmente
# distinta (ya nos pasó con PoE/storm-control en el CE12800, que no tiene
# nada que ver con esto). Probado: no matchea esos otros casos.

create_vlan:
  primary:
    block:
      - "system-view"
      - "vlan {vlan_id}"
      - "description {name}"
      - "quit"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "vlan {vlan_id}"
        - "description {name}"
        - "quit"
        - "quit"

delete_vlan:
  primary:
    block:
      - "system-view"
      - "undo vlan {vlan_id}"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "undo vlan {vlan_id}"
        - "quit"

update_vlan:
  primary:
    block:
      - "system-view"
      - "vlan {vlan_id}"
      - "description {name}"
      - "quit"
      - "commit"
      - "quit"
  alternatives:
    - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
      block:
        - "system-view"
        - "vlan {vlan_id}"
        - "description {name}"
        - "quit"
        - "quit"

save_config:
  primary:
    block: ["save force"]

list_vlans:
  primary:
    commands: ["display vlan"]

list_ports:
  primary:
    commands:
      - "display interface brief"
      - "display interface description"
      - "display port vlan"
      # 4to comando: bulk-read del storm-control. `display current-
      # configuration interface` dumpea la config completa de TODAS las
      # interfaces (incluyendo las líneas "storm control ..." cuando
      # están seteadas). Ausencia de línea "storm control" en la sección
      # de un puerto = disabled. Un solo comando cubre todos los puertos,
      # mismo criterio que los otros 3 bulk reads. Alternativa (no
      # implementada acá): "display storm-control", que no está en todas
      # las versiones de VRP -- current-configuration siempre está.
      - "display current-configuration interface"

# Todo comando de puertos de acá en adelante sustituye {interface} en la
# primera línea ("interface {interface}") -- 2 devices reales confirman
# que este vendor/platform NO tiene un único formato de nombre de
# interfaz para comandos de config: f3r9s2 (S-series real) exige el
# nombre completo ("GigabitEthernet0/0/1") y rechaza la forma abreviada
# ("Error: Wrong parameter found" apenas se manda "interface GE0/0/1");
# huawei01 (CE12800 de lab) es al revés, exige la abreviada y rechaza la
# completa con el mismo error. El driver (huawei/driver.py) manda ambas
# formas como vars separadas -- {interface} (abreviada, la que usan los
# comandos de lectura y el resto del sistema) e {interface_full}
# (completa, calculada por expandir_nombre_interfaz()) -- primary intenta
# con la abreviada primero (funciona en el lab y es la forma "nativa" del
# resto del sistema), y esta alternativa reintenta con la completa cuando
# el device la rechaza.
_INTERFACE_WRONG_PARAM: &interface_wrong_param 'interface \S+\r?\n\s*\^\r?\nError: Wrong parameter found'

update_port_description:
  set:
    primary:
      block:
        - "system-view"
        - "interface {interface}"
        - "description {description}"
        - "commit"
        - "quit"
        - "quit"
    alternatives:
      - triggered_by_error: *interface_wrong_param
        block:
          - "system-view"
          - "interface {interface_full}"
          - "description {description}"
          - "quit"
          - "quit"
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
