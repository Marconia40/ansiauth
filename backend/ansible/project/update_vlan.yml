---
- name: Update VLAN name on Cisco device
  hosts: "{{ device }}"
  gather_facts: no

  tasks:
    - name: Update VLAN name
      cisco.ios.ios_config:
        parents: "vlan {{ vlan_id }}"
        lines:
          - name {{ description }}
      register: result

    - name: Save running config
      cisco.ios.ios_config:
        save_when: always
