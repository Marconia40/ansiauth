---
# Set a port to access mode with a given access VLAN, atomically, on
# Cisco IOS. Replaces the old generic configure_port composite call for
# this specific, well-defined operation.
#
# Runs `switchport mode access` + `switchport access vlan {{ vlan_id }}`
# inside the interface context, in the same ios_config task — one CLI
# session, one commit, no intermediate state where the port is in access
# mode with the wrong (or no) VLAN assigned.
#
# Vars expected:
#   interface (str)
#   vlan_id   (int)
#   device    (str) — diagnostic only

- name: Set access mode on Cisco IOS device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply access mode and VLAN
      cisco.ios.ios_config:
        parents: "interface {{ interface }}"
        lines:
          - "switchport mode access"
          - "switchport access vlan {{ vlan_id }}"
        save_when: always
