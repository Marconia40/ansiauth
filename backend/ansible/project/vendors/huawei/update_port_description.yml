---
# Step 2.1 — Update port description on Huawei VRP.
#
# Behaviour:
#   * description non-empty → `description <text>` inside the interface view
#   * description empty     → `undo description` (clears any prior value)
#
# Both branches commit; VRP commits are idempotent so re-running with the
# same description is a no-op.
#
# Vars expected:
#   interface          (str) — vendor-native interface name
#   description        (str) — may be empty/whitespace; treated as a clear
#   description_is_empty (bool) — caller-computed flag so we don't double
#       check empty-string semantics here (Ansible whitespace stripping is
#       inconsistent across versions).
#   device             (str) — passed only for diagnostic logs in the driver

- name: Update port description on Huawei VRP device
  hosts: all
  gather_facts: no

  tasks:
    - name: Set or clear port description
      ansible.netcommon.cli_command:
        command: "{{ command_block }}"
      vars:
        command_block: |
          system-view
          interface {{ interface }}
          {% if description_is_empty %}
          undo description
          {% else %}
          description {{ description }}
          {% endif %}
          commit
          quit
          quit
