# Sintaxis confirmada contra un device real (no el CE12800 de lab): usa
# min-rate/max-rate por tipo de tráfico, no un único "level" como Cisco --
# {threshold} se sustituye en las 4 posiciones numéricas (broadcast +
# multicast, min y max iguales). "storm-control action block" +
# "storm-control enable trap" son fijas, sin placeholder.
#
# 2 variaciones reales conocidas, cada una con su propia alternativa:
#   - Algunos Huawei no soportan la línea de multicast (rechazan
#     "storm-control multicast..." como comando no reconocido) --
#     alternativa: mismo bloque sin esa línea.
#   - Los mismos Huawei "sin commit" ya vistos en el resto de este archivo
#     también aplican acá -- alternativa: mismo bloque (con multicast) sin
#     "commit".
# Si algún device necesitara las 2 variaciones a la vez, agregar una 3ra
# alternativa combinada cuando se confirme ese caso real -- no
# precombinado a ciegas.
set_storm_control:
  enabled:
    primary:
      block:
        - "system-view"
        - "interface {interface}"
        - "storm-control broadcast min-rate percent {threshold} max-rate percent {threshold}"
        - "storm-control multicast min-rate percent {threshold} max-rate percent {threshold}"
        - "storm-control action block"
        - "storm-control enable trap"
        - "commit"
        - "quit"
        - "quit"
    alternatives:
      - triggered_by_error: 'storm-control[^\n]*\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface {interface}"
          - "storm-control broadcast min-rate percent {threshold} max-rate percent {threshold}"
          - "storm-control action block"
          - "storm-control enable trap"
          - "commit"
          - "quit"
          - "quit"
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface {interface}"
          - "storm-control broadcast min-rate percent {threshold} max-rate percent {threshold}"
          - "storm-control multicast min-rate percent {threshold} max-rate percent {threshold}"
          - "storm-control action block"
          - "storm-control enable trap"
          - "quit"
          - "quit"
  disabled:
    primary:
      block:
        - "system-view"
        - "interface {interface}"
        - "undo storm-control broadcast"
        - "undo storm-control multicast"
        - "undo storm-control action"
        - "undo storm-control enable trap"
        - "commit"
        - "quit"
        - "quit"
    alternatives:
      - triggered_by_error: 'storm-control[^\n]*\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface {interface}"
          - "undo storm-control broadcast"
          - "undo storm-control action"
          - "undo storm-control enable trap"
          - "commit"
          - "quit"
          - "quit"
      - triggered_by_error: '\]commit\r?\n\s*\^\r?\nError: Unrecognized command'
        block:
          - "system-view"
          - "interface {interface}"
          - "undo storm-control broadcast"
          - "undo storm-control multicast"
          - "undo storm-control action"
          - "undo storm-control enable trap"
          - "quit"
          - "quit"

reset_port:
  primary:
    # "clear configuration interface" pide confirmación interactiva
    # ("Warning: ... Continue? [Y/N]") y se aplica de inmediato -- no lleva
    # "commit" después. Confirmado contra el device real: con "commit" en
    # la línea siguiente, el device lo interpretaba como respuesta
    # inválida al prompt Y/N y quedaba reintentando hasta timeout.
    block:
      - "system-view"
      - "clear configuration interface {interface}"
      - "y"
      - "quit"

