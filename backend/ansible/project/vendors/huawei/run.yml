---
# Single generic playbook for every Huawei VRP operation — mutations run
# a full command block (system-view / context / commands / commit / quit(s),
# or a bare exec command like `save force`) through `command_block`
# (ansible.netcommon.cli_command); reads loop over `commands`. Replaces the
# 14 near-identical per-operation playbooks this used to be split across
# (including configure_port.yml and save_config.yml) — the only thing that
# varied between them was the content of the command block, which now
# lives in the Python driver instead.
#
# Vars expected (mutually exclusive):
#   command_block (str) — full multi-line command sequence to run verbatim,
#     already including system-view/context/commit/quit(s) as needed (VRP's
#     exact ordering differs by context — `vlan X` wants `quit` before
#     `commit`, `interface X` wants `commit` before `quit` — so the driver
#     builds the whole block instead of this playbook guessing an order).
#   command_blocks (list[str]) — batching de N mutaciones independientes en
#     1 sola conexión (base.py:aplicar_lote()). Cada item es un bloque
#     COMPLETO igual de autocontenido que command_block (su propio
#     system-view/commit/quit(s)) -- Ansible reusa la conexión entre
#     iteraciones del loop (confirmado en vivo: 3 bloques completos vía
#     este mecanismo tardaron 6.17s contra 14.97s como 3 invocaciones de
#     playbook separadas, mismo device real). No reemplaza command_block
#     (que sigue usando cada operación individual) -- es la forma que usa
#     el camino de batch nuevo.
#   commands (list[str]) — read commands, one cli_command task per item.
#   device (str) — diagnostic only.

- name: Huawei VRP device operation
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply command block
      when: command_block is defined
      ansible.netcommon.cli_command:
        command: "{{ command_block }}"

    - name: Apply command block batch
      when: command_blocks is defined
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ command_blocks }}"

    # 2 tasks para el mismo cli_command loop, elegidas por
    # tolerate_command_errors (extravar seteado por VendorDriver._leer()
    # cuando el caller pasa partial_ok=True). Ver comentario largo en
    # vendors/cisco/run.yml -- misma lógica, misma razón. En VRP el
    # marker típico es "Error: Unrecognized command" (ver
    # VendorDriver._UNSUPPORTED_COMMAND_MARKERS).
    - name: Run read commands (strict — default)
      when: commands is defined and not (tolerate_command_errors | default(false) | bool)
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ commands }}"

    - name: Run read commands (tolerant — per-command errors surface as text)
      when: commands is defined and (tolerate_command_errors | default(false) | bool)
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ commands }}"
      failed_when: false
