---
- name: Delete VLAN on Cisco device
  hosts: "{{ device }}"
  gather_facts: no

  tasks:
    - name: Remove VLAN
      cisco.ios.ios_config:
        lines:
          - no vlan {{ vlan_id }}
      register: result

    - name: Save running config
      cisco.ios.ios_config:
        save_when: always
