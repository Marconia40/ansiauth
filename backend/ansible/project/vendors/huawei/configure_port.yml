---
# Step 3.2 — Composite port configuration on Huawei VRP.
#
# Applies any combination of the following mutations in a single candidate-config
# session, committed atomically.  Only the sections whose boolean guard is true
# are emitted — no mutation touches fields that were not requested.
#
# Ordering guarantees (enforced here, not in the driver):
#   1. mode (link-type)       — must precede VLAN commands on VRP
#   2. VLAN assignment        — access or trunk, never both (model-validated)
#   3. description            — independent; safe in any position after mode/VLAN
#   4. admin state            — independent; applied last so a failing VLAN change
#                               does not silently leave the port in a changed
#                               admin state
#   5. commit + exit
#
# Safety contract (enforced by PortConfigRequest before this playbook is called):
#   * configure_access_vlan and configure_trunk_vlans are mutually exclusive.
#   * access_vlan represents the access VLAN (mode='access') OR the trunk PVID (mode='trunk').
#   * is_trunk_pvid distinguishes the two: True when applying access_vlan as trunk PVID.
#   * vlan_list is only meaningful when mode is 'trunk'.
#
# Vars expected:
#   interface             (str)  — vendor-native interface name
#   device                (str)  — diagnostic only
#   configure_mode        (bool) — apply link-type change
#   mode                  (str)  — 'access' or 'trunk'  (only when configure_mode)
#   configure_access_vlan (bool) — apply PVID or access VLAN
#   access_vlan           (int)  — VLAN ID               (only when configure_access_vlan)
#   is_trunk_pvid         (bool) — True → port trunk pvid vlan; False → port default vlan
#   configure_trunk_vlans (bool) — apply trunk allow-pass vlan list
#   vlan_list             (str)  — Huawei-format range string (only when configure_trunk_vlans)
#   configure_description (bool) — apply description change
#   description           (str)  — description text       (only when configure_description)
#   description_is_empty  (bool) — True → undo description (only when configure_description)
#   configure_admin       (bool) — apply admin-state change
#   admin_enabled         (bool) — True → undo shutdown / False → shutdown

- name: Configure port (composite) on Huawei VRP device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply requested port configuration
      ansible.netcommon.cli_command:
        command: "{{ command_block }}"
      vars:
        command_block: |
          system-view
          interface {{ interface }}
          {% if configure_mode %}
          port link-type {{ mode }}
          {% endif %}
          {% if configure_access_vlan %}
          {% if is_trunk_pvid %}
          port trunk pvid vlan {{ access_vlan }}
          {% else %}
          port default vlan {{ access_vlan }}
          {% endif %}
          {% endif %}
          {% if configure_trunk_vlans %}
          undo port trunk allow-pass vlan all
          port trunk allow-pass vlan {{ vlan_list }}
          {% endif %}
          {% if configure_description %}
          {% if description_is_empty %}
          undo description
          {% else %}
          description {{ description }}
          {% endif %}
          {% endif %}
          {% if configure_admin %}
          {% if admin_enabled %}
          undo shutdown
          {% else %}
          shutdown
          {% endif %}
          {% endif %}
          commit
          quit
          quit
