---
# Step 1.1 — Port visibility on Huawei VRP devices.
#
# Read-only.  Three sequential cli_command tasks return the raw text for
# three orthogonal views of the device's interface state:
#
#   1. `display interface brief`        → admin / operational state
#   2. `display interface description`  → operator-supplied description
#   3. `display port vlan`              → mode, PVID, trunk VLAN list
#
# Each task registers its stdout as a separate fact.  The driver layer
# consumes all three outputs from ansible-runner events via the shared
# `_extract_all_command_outputs()` helper, then merges them into normalized
# `PortInfo` objects in the Huawei port parser.

- name: Get port inventory from Huawei VRP device
  hosts: all
  gather_facts: no

  tasks:
    - name: Display interface brief
      ansible.netcommon.cli_command:
        command: display interface brief
      register: brief_output

    - name: Display interface description
      ansible.netcommon.cli_command:
        command: display interface description
      register: description_output

    - name: Display port vlan
      ansible.netcommon.cli_command:
        command: display port vlan
      register: port_vlan_output
