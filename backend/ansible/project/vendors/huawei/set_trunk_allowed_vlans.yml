---
# Step 2.4 — Set trunk allowed VLANs on Huawei VRP.
#
# Strategy: clear the current allowed list completely, then set the desired
# list.  Both commands are in the candidate config and committed atomically
# via `commit`, so no transient blackout window exists on VRP.
#
# Pre-condition (enforced by the orchestration layer, not here):
#   * the interface is already in `port link-type trunk` mode.
#   * vlan_list is a non-empty, validated, compressed range string.
#
# Vars expected:
#   interface (str)
#   vlan_list (str) — e.g. "10 to 12 20 30 to 35"
#   device    (str) — diagnostic only

- name: Set trunk allowed VLANs on Huawei VRP device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply trunk VLAN list (clear + set)
      ansible.netcommon.cli_command:
        command: |
          system-view
          interface {{ interface }}
          undo port trunk allow-pass vlan all
          port trunk allow-pass vlan {{ vlan_list }}
          commit
          quit
          quit
