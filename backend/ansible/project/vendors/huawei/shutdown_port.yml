---
# Step 3.2 — Administratively disable (shutdown) a port on Huawei VRP.
#
# Semantic counterpart to enable_port.yml.  Both exist as intent-named
# operations beside set_port_admin_state.yml (which takes a boolean flag).
# The driver chooses the appropriate playbook based on the desired action
# so the Ansible task name is always self-describing in the run log.
#
# VRP candidate-config model: the shutdown command is staged and committed
# atomically; if the commit fails, the port state is unchanged.
#
# Vars expected:
#   interface (str) — vendor-native interface name (e.g. GigabitEthernet0/0/1)
#   device    (str) — diagnostic only

- name: Administratively disable (shutdown) a port on Huawei VRP
  hosts: all
  gather_facts: no

  tasks:
    - name: Shutdown port
      ansible.netcommon.cli_command:
        command: |
          system-view
          interface {{ interface }}
          shutdown
          commit
          quit
          quit
