---
- name: Get VLANs from Cisco device
  hosts: all
  gather_facts: no

  tasks:
    - name: Show VLAN brief
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_output

    - name: Return VLAN output
      debug:
        msg: "{{ vlan_output.stdout[0] }}"
